name: CI

on:
  push:
  pull_request:

# Least privilege: jobs only check out code and upload artifacts
# (upload-artifact uses the runtime token, not GITHUB_TOKEN), so read-only
# contents suffices. Renderer *tests* that need a GPU adapter self-skip on
# headless runners (they print a skip message), so no software-rasterizer
# setup is added for them; the `linux` job below does install one, because it
# runs the xscreensaver host for real rather than self-skipping.
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  # The fast gate: formatting, lints and commit messages. Kept in one job of its own
  # rather than bolted onto the platform jobs, so a broken gate reports without waiting
  # behind a GPU-less test run or a saver bundle. The lint *levels* are not set here:
  # they live in the root Cargo.toml's [workspace.lints] table, which every member opts
  # into, so this job runs plain `cargo clippy` and a local run catches the same things.
  # Nothing silences a warning at the crate level.
  lint:
    name: lint (fmt, clippy, commit messages)
    # macOS rather than the cheaper ubuntu: gibson-ffi links `oslog`, whose C wrapper includes
    # <os/log.h>, so it is the one crate that cannot be built on Linux at all - no workflow
    # builds it off macOS today (the `linux` and `windows` jobs select their crates by hand).
    # Linting the whole workspace with no exclusions, exactly as CONTRIBUTING.md and
    # `make lint` spell it, needs the runner where the whole workspace builds. The linux- and
    # windows-only host code in `gibson-app` is not linted by Clippy anywhere; its rustc lints
    # (the `unused` group) are denied by [workspace.lints] wherever it is compiled, which is
    # the `linux`/`windows` jobs.
    runs-on: macos-15
    strategy:
      fail-fast: false
    steps:
      # Full history: the commit-message gate below has to resolve the pull request's
      # base and head commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No `-- -D warnings`: [workspace.lints] already denies clippy::all and rustc's
      # unused group, so this fails on a warning by itself.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy the workspace
        run: cargo clippy --workspace --exclude gibson-web --all-targets
      # gibson-web is #![cfg(target_arch = "wasm32")], so on a native host it compiles to
      # nothing and a native lint proves nothing about it. The wasm32 target is installed
      # above; the same two steps are in CONTRIBUTING.md.
      - name: Clippy gibson-web for wasm32
        run: cargo clippy -p gibson-web --target wasm32-unknown-unknown --all-targets
      # Conventional Commits, on the commits this pull request adds. The range is
      # `base...head` with three dots: it starts at the merge base, so the history from
      # before the convention was adopted is never judged and no pull request fails on a
      # message it did not write. See scripts/check-commit-messages.sh.
      - name: Check the commit messages this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-messages.sh "$BASE_SHA...$HEAD_SHA"
      # A squash merge takes the pull request title as the commit subject, so the title has
      # to be a Conventional Commit as well. The title arrives through the environment
      # rather than interpolated into the command line: it is contributor-controlled text.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | scripts/check-commit-messages.sh

  macos:
    name: macOS (saver, tests)
    # macos-15 is the oldest GA Apple-silicon hosted image (macos-14 arm64 is
    # deprecated); per actions/runner-images, the bare `macos-15` label is the
    # Arm64 image, which matches the ARCHS=arm64 saver build below.
    runs-on: macos-15
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --workspace --exclude gibson-web
      # The saver Makefile parses `cargo rustc --print native-static-libs`
      # output, so keep CARGO_TERM_COLOR unset at the workflow level; any step
      # that parses cargo/rustc output must override it locally (the Makefile
      # now does).
      # Release assets are universal (arm64 x86_64); this job stays single-arch
      # because it only has to prove the bundle builds. See release.yml.
      - name: Build saver (arm64)
        run: make -C platform/macos ARCHS=arm64
      - name: Package saver
        run: |
          cd platform/macos/build
          zip -rq Gibson.saver.zip Gibson.saver
          shasum -a 256 Gibson.saver.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gibson.saver.zip
          path: |
            platform/macos/build/Gibson.saver.zip
            platform/macos/build/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows (scr, tests)
    # windows-latest currently maps to Windows Server 2025 (x64), per
    # actions/runner-images.
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No gibson-render (no GPU adapter on hosted runners; its tests only
      # self-skip anyway) and no gibson-web (wasm-only crate) on native hosts.
      - name: Run tests
        run: cargo test -p gibson-scene -p gibson-atlas -p gibson-floor -p gibson-app
      - name: Build release
        run: cargo build --release -p gibson-app
      - name: Stage .scr
        shell: pwsh
        run: Copy-Item target/release/gibson-app.exe Gibson.scr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gibson.scr
          path: Gibson.scr
          if-no-files-found: error

  linux:
    name: Linux (xscreensaver host, tests)
    # ubuntu-latest currently maps to Ubuntu 24.04 (x64), per
    # actions/runner-images.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # winit 0.30 x11/wayland backends and x11-dl: x11-dl dlopens libX11 at
      # runtime, but winit's wayland stack links libwayland-client and needs
      # libxkbcommon headers at build time.
      # Must stay in sync with the same step in release.yml.
      - name: Install X11 / Wayland dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Same native test set as Windows: no gibson-render, no gibson-web.
      - name: Run tests
        run: cargo test -p gibson-scene -p gibson-atlas -p gibson-floor -p gibson-app
      - name: Build release
        run: cargo build --release -p gibson-app
      # The runtime test: the only place the xscreensaver host is ever
      # executed. Xvfb supplies an X server with a 24-bit screen (its default
      # 8-bit screen has no visual that a Vulkan surface can target), and
      # Mesa's lavapipe a software Vulkan device - wgpu's native backend set on
      # Linux is Vulkan only, so an ICD is mandatory on a runner with no GPU.
      # Kept separate from the build-dependency step above, which must stay in
      # sync with release.yml: that job only builds and packages, and never
      # runs the hack.
      - name: Install the runtime-test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
      # This step fails loudly and prints the window id, the adapter line and
      # the frame counters on every path, so a failure here is diagnosable
      # from the job log alone.
      - name: Smoke-test the xscreensaver host under Xvfb
        run: |
          set -euo pipefail
          vulkaninfo --summary || true
          xvfb-run -a -s "-screen 0 800x600x24" \
            bash platform/linux/smoke-test.sh target/release/gibson-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gibson-app
          path: target/release/gibson-app
          if-no-files-found: error

  wasm:
    name: wasm (web bundle)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Prebuilt binary from the official wasm-pack GitHub release (matches the
      # v0.15.0 the project develops against) instead of `cargo install`, which
      # would rebuild it from source on every run. Digest verified before use.
      # Must stay in sync with the same step in pages.yml and release.yml.
      - name: Install wasm-pack
        run: |
          curl -sSfL -o wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz
          echo "$PWD/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build web bundle
        run: wasm-pack build crates/gibson-web --target web --release --out-dir ../../web/pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: web
          if-no-files-found: error
