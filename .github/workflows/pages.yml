name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deployment: read the repo, write the Pages
# environment, mint the deployment OIDC token. GitHub Pages is already
# configured for build_type=workflow on this repo, so no repository-settings
# step is required here.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build wasm and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain step: rust-toolchain.toml pins the exact version and rustup selects it in
      # the checkout. See the note in ci.yml.
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Prebuilt binary from the official wasm-pack GitHub release; kept in
      # sync with the `wasm` job in ci.yml. Digest verified before use.
      - name: Install wasm-pack
        run: |
          curl -sSfL -o wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz
          echo "$PWD/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build web bundle
        run: wasm-pack build crates/gibson-web --target web --release --out-dir ../../web/pkg
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
