[package]
name = "gibson-ffi"
description = "Hack the Gibson C ABI bridge used by the macOS screen saver (staticlib linked from Swift)."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
gibson-types = { workspace = true }
gibson-core = { workspace = true }
# SurfaceTargetUnsafe / wgpu::rwh come from wgpu itself so the handle versions match.
wgpu = { workspace = true }
serde_json = { workspace = true }
pollster = { workspace = true }
log = { workspace = true, features = ["std"] }
# os_log sink for the `log` facade (forward Rust-side diagnostics to the
# unified log); default features (logger/dashmap) unused - we hand-roll a
# two-line Log impl over oslog::OsLog.
oslog = { version = "0.2", default-features = false }

# Opt into the root Cargo.toml's [workspace.lints] policy: one place sets levels, so a local
# `cargo clippy` reports exactly what CI does.
[lints]
workspace = true
