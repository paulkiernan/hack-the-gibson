<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hack the Gibson</title>
  <meta name="description" content="WebGPU/WebGL2 flythrough of the Gibson tower city from the 1995 film Hackers, rebuilt in Rust and wgpu.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Crect%20x%3D'4'%20y%3D'1'%20width%3D'8'%20height%3D'14'%20fill%3D'%2348E8FF'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'2.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'5.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'8.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'11.3'%20width%3D'4'%20height%3D'1.7'%20fill%3D'%23C060FF'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'13.8'%20width%3D'5'%20height%3D'1.2'%20fill%3D'%23000714'%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="gibson"></canvas>
  <div id="status" role="status"></div>
  <a id="repo" href="https://github.com/paulkiernan/hack-the-gibson">paulkiernan/hack-the-gibson</a>
  <script type="module">
    import init from './pkg/gibson_web.js';
    init().catch((err) => {
      const status = document.getElementById('status');
      if (status) status.textContent = 'Failed to load the WebAssembly module: ' + err;
      console.error('gibson: module init failed', err);
    });
  </script>
</body>
</html>
