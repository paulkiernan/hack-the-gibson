[package]
name = "gibson-atlas"
description = "Hack the Gibson tower-face text atlas generator: mosaic and directory panels rasterized with fontdue."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gibson-types = { workspace = true }
fontdue = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
png = { workspace = true }

# Opt into the root Cargo.toml's [workspace.lints] policy: one place sets levels, so a local
# `cargo clippy` reports exactly what CI does.
[lints]
workspace = true
