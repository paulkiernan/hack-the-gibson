<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hack the Gibson</title>
  <meta name="description" content="WebGPU/WebGL2 flythrough of the Gibson tower city from the 1995 film Hackers, rebuilt in Rust and wgpu.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Crect%20x%3D'4'%20y%3D'1'%20width%3D'8'%20height%3D'14'%20fill%3D'%2348E8FF'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'2.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'5.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'8.5'%20width%3D'5'%20height%3D'1.5'%20fill%3D'%23000714'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'11.3'%20width%3D'4'%20height%3D'1.7'%20fill%3D'%23C060FF'%2F%3E%3Crect%20x%3D'5.5'%20y%3D'13.8'%20width%3D'5'%20height%3D'1.2'%20fill%3D'%23000714'%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="gibson"></canvas>
  <div id="status" role="status"></div>
  <a id="repo" href="https://github.com/paulkiernan/gibson-screensaver">paulkiernan/gibson-screensaver</a>
  <!-- Buy Me a Coffee floating button. This is the official widget script; it only works on a
       real page like this one, not in the README, because GitHub strips <script> from markdown.
       The script injects a `position: static` anchor where it sits in the document, which would
       land just below the 100vh canvas and be scrolled off the fold, so it is wrapped in a
       fixed-position container. -->
  <div id="support">
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="paulynomial" data-color="#BD5FFF" data-emoji="" data-font="Lato" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#ffffff" data-coffee-color="#FFDD00"></script>
  </div>
  <!-- Bootstrap watchdog. The module script below reports its own failures, but if it never runs
       at all - a stale cached bundle, a blocked script, a browser too old to parse it - nothing
       would say so, and a black page with no message is the worst outcome. Registered before the
       module loads and deliberately silent once frames are running so a late third-party error
       (the support widget) cannot take over the status line. -->
  <script>
    window.gibsonState = "loading";
    (function () {
      function describe(reason) {
        if (reason && reason.message) return reason.message;
        return String(reason);
      }
      function show(text) {
        if (window.gibsonState === "running") return; // report console-only from here on
        var el = document.getElementById("status");
        if (el && !el.textContent) el.textContent = "Hack the Gibson could not start: " + text;
      }
      window.addEventListener("error", function (event) {
        console.error("gibson: uncaught error", event.error || event.message);
        show(describe(event.error || event.message));
      });
      window.addEventListener("unhandledrejection", function (event) {
        console.error("gibson: unhandled rejection", event.reason);
        show(describe(event.reason));
      });
      window.setTimeout(function () {
        if (window.gibsonState === "loading") {
          show("the module never started (see the browser console)");
        }
      }, 20000);
    })();
  </script>
  <script type="module">
    import init, { boot } from './pkg/gibson_web.js';
    init().then(() => boot()).catch((err) => {
      window.gibsonState = "failed";
      const status = document.getElementById('status');
      // Rust reports startup failures itself (with the console detail); this only fills the gap
      // when the failure happened before any Rust ran, such as the module failing to load.
      if (status && !status.textContent) {
        status.textContent = 'Hack the Gibson could not start: ' + (err && err.message ? err.message : err);
      }
      console.error('gibson: startup failed', err);
    });
  </script>
</body>
</html>
