name: Release

# The distribution channel: GitHub Releases whose assets are plain downloads
# that need no account and do not expire (unlike workflow artifacts).
#
# Triggered by pushing a bare semver tag: `2.0.1`, never `v2.0.1`. The tag IS
# the [workspace.package] version in Cargo.toml, character for character, so
# there is no prefix to strip anywhere in this file.
#
# The `tags:` filter below is a glob, and a glob cannot express semver. It is
# only a coarse prefilter, so that a tag which is plainly not a release (`main`,
# `nightly`) never starts a run. Everything the prefilter lets through is judged
# by the guard job, which applies the semver.org regex; a near miss such as
# `2.0.01` or `2.0.1.1` therefore starts a run and fails within seconds, before
# anything is built or created.
#
# `workflow_dispatch` runs the same pipeline with `dry_run` defaulting to true,
# so every platform can be built and checked without creating, filling or
# publishing a release.
#
# Shape: guard -> create-release (draft) -> parallel builds -> finalize
# (SHA256SUMS + publish). A build that fails leaves a draft release behind and
# never publishes a half-populated one. A tag with a `-prerelease` component is
# created as a GitHub prerelease, so it never becomes the "Latest release".
on:
  push:
    # Quoted: `[` is a YAML special character, and GitHub requires a pattern
    # starting with it to be quoted. GitHub's documented glob syntax is `*`
    # (zero or more characters, excluding `/`), `**`, `?`, `+`, `[]` ranges and
    # `!`; `.` is a literal and `*` matches it, so this is deliberately looser
    # than semver. The guard job is what rejects the difference.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release: bare semver, e.g. 2.1.0-rc.1. Must already exist and match the workspace version. Empty means the workspace version."
        required: false
        type: string
      dry_run:
        description: "Build every asset but create no release and upload nothing."
        required: false
        type: boolean
        default: true

# Least privilege: read by default. Every job that reads or writes a release
# re-declares `contents: write` (a draft release is only visible to tokens with
# write access, so even the download in `finalize` needs it). GH_TOKEN is the
# automatic token capped by this block; no third-party release action is used.
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  # gh resolves its target repository from a local git remote when it is not
  # told otherwise, so any job without an actions/checkout step dies with
  # "failed to run git: fatal: not a git repository". GH_REPO (documented in
  # `gh help environment` as the repo "for commands that otherwise operate on a
  # local repository") pins the target for every gh invocation in this file and
  # removes the implicit-git-context dependency entirely.
  GH_REPO: ${{ github.repository }}

jobs:
  # Cheap first gate. A release tagged 2.1.0 off a tree whose Cargo.toml still
  # says 2.0.0 is a defect worth failing in ten seconds rather than after six
  # platform builds, so this runs before anything is created. It is also the
  # only place the tag is validated: the `tags:` glob above is a prefilter, not
  # a semver check.
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      # The official suggested regex from semver.org, "Is there a suggested
      # regular expression (RegEx) to check a SemVer string?" -- the
      # numbered-capture variant (cg1..cg3 = major/minor/patch, cg4 =
      # prerelease, cg5 = build metadata), which semver.org marks as compatible
      # with ECMAScript, PCRE, Python and Go. Copied from the spec verbatim, not
      # hand-rolled; single-quoted YAML so the backslashes survive intact.
      SEMVER_RE: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
      # Python evaluates it (semver.org lists Python as a supported engine for
      # this regex, and python3 is preinstalled on the runner image), so the
      # pattern needs no porting to another dialect: `re.fullmatch` requires the
      # whole string to match, and `re.ASCII` keeps `\d` to ASCII so a Unicode
      # digit cannot pass as a version component. Both steps below run the
      # pattern through this one definition, so the self-test can never drift
      # from the check it is testing.
      SEMVER_CHECK: 'import re, sys; raise SystemExit(0 if re.fullmatch(sys.argv[1], sys.argv[2], re.ASCII) else 1)'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This regex is now the gate that decides whether a release can be
      # published, and its failure mode is silent: a pattern mangled by an edit
      # still accepts every valid tag and quietly lets bad ones through. So the
      # pattern is run over the shapes the spec defines (must match) and over
      # the near misses a looser pattern would wave through (must not match)
      # before it is applied to a real tag.
      - name: Self-test the semver gate
        shell: bash
        run: |
          set -euo pipefail
          accept=(2.0.1 0.1.0 10.20.30 2.1.0-rc.1 2.1.0-alpha.0.1 2.1.0+build.5 2.1.0-rc.1+build.5)
          reject=(v2.0.1 2.0 2 2.0.1.1 2.0.01 01.2.3 2.0.1- banana '')
          failed=0
          for tag in "${accept[@]}"; do
            if ! python3 -c "$SEMVER_CHECK" "$SEMVER_RE" "$tag"; then
              echo "::error::semver gate rejected the valid version '$tag'"
              failed=1
            fi
          done
          for tag in "${reject[@]}"; do
            if python3 -c "$SEMVER_CHECK" "$SEMVER_RE" "$tag"; then
              echo "::error::semver gate accepted the invalid version '$tag'"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "semver gate: ${#accept[@]} valid accepted, ${#reject[@]} invalid rejected"
      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]/ { section = 1; next }
            /^\[/                     { section = 0 }
            section && /^version[[:space:]]*=/ {
              line = $0
              sub(/^[^"]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version found in [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Inputs and ref names reach the shell through env, never by direct
      # interpolation, so a tag name can never be executed.
      - name: Resolve the tag and assert it is the workspace version
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$VERSION"
          else
            tag="$REF_NAME"
          fi

          # Strict semver, which also encodes "no v prefix": `v2.0.1`, `2.0`,
          # `2`, `2.0.1.1`, `2.0.01` and `01.2.3` all fail here.
          if ! python3 -c "$SEMVER_CHECK" "$SEMVER_RE" "$tag"; then
            echo "::error::tag '$tag' is not a semver version; expected major.minor.patch with optional -prerelease and +build metadata, e.g. '2.0.1' or '2.1.0-rc.1' (no 'v' prefix)"
            exit 1
          fi

          # Plain string comparison: the tag IS the [workspace.package] version,
          # so nothing is stripped from either side.
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::tag '$tag' does not match version '$VERSION' from [workspace.package] in Cargo.toml; bump the version or retag"
            exit 1
          fi

          # A tag is a prerelease when it has a `-prerelease` component. Build
          # metadata alone (`2.1.0+build.5`) is a stable release, and metadata
          # may itself contain a dash (`2.1.0+build-5`), so strip `+...` before
          # looking for the separator.
          base="${tag%%+*}"
          case "$base" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "tag: $tag"
          echo "prerelease: $prerelease"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: guard
    # On a tag push always run; on a manual dispatch only when dry_run is off.
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
      # "true" or "false", straight from the guard's semver parse. Used as the
      # value of gh's boolean `--prerelease` flag, so both cases take the same
      # code path.
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Re-running a tag whose draft already exists (a retry after one platform
      # flaked) reuses it instead of failing, and `--clobber` on every upload
      # replaces the assets. Release immutability is not enabled on this repo,
      # so a re-run after publish also works.
      - name: Create the draft release
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
            exit 0
          fi
          # Multiline body, so a notes file rather than shell quoting. The body
          # is prepended by the API to the notes `--generate-notes` produces.
          cat > "$RUNNER_TEMP/release-body.md" <<'EOF'
          A Rust + wgpu reimplementation of the Gibson tower-city flythrough from *Hackers* (1995).
          Every asset below is a direct download: no GitHub account, no expiry.

          | Asset | Platform | How to use it |
          | --- | --- | --- |
          | `Gibson.saver.zip` | macOS 14+ | Screen saver, universal (Apple silicon + Intel). Unzip it, then double-click `Gibson.saver` to install it. |
          | `hack-the-gibson-macos-universal.tar.gz` | macOS 14+ | Windowed desktop app, universal. Untar it and run `hack-the-gibson-macos-universal/gibson-app`. |
          | `Gibson.scr` | Windows | Screen saver. Save it, then right-click it and choose Install. |
          | `hack-the-gibson-linux-x86_64.tar.gz` | Linux x86_64 | Desktop app, plus the xscreensaver hack with its `gibson.xml` descriptor. See `README.txt` inside. |
          | `hack-the-gibson-web.zip` | any modern browser | Static WebGPU/WebGL2 build for self-hosting. Serve the directory over HTTP. |

          Check the download before running anything:

          ```sh
          shasum -a 256 -c SHA256SUMS    # macOS
          sha256sum -c SHA256SUMS        # Linux
          ```

          **macOS:** the screen saver and the desktop app are ad-hoc signed but not notarized, so
          Gatekeeper refuses the first launch. Right-click the app (or the `Gibson.saver` bundle) and
          choose Open, or approve it once under System Settings > Privacy & Security. To install the
          screen saver by hand, copy it to `~/Library/Screen Savers/`.

          The Windows and Linux hosts are compile-verified in CI on every release but have not been
          run on real hardware yet.
          EOF
          # `--prerelease` takes the guard's answer directly, so a stable tag and
          # a prerelease tag follow the same code path. GitHub derives the
          # "Latest release" from the most recent published release that is
          # neither a draft nor a prerelease, and `--latest` is left unset here
          # (gh only sends make_latest when it is passed), so a prerelease can
          # never take over "Latest" and a stable tag is marked latest exactly
          # as it was before. The title says which one this is, because the
          # prerelease banner is otherwise the only cue on the release page.
          title="Hack the Gibson ${TAG}"
          if [ "$PRERELEASE" = "true" ]; then
            title="$title (prerelease)"
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --prerelease="$PRERELEASE" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --generate-notes

  # macOS carries two assets because they share the x86_64 dependency builds:
  # the saver Makefile links a Rust staticlib per arch, and the app is built for
  # both triples in the same job.
  build-macos:
    name: macOS (universal)
    needs: [guard, create-release]
    if: always() && !cancelled() && needs.guard.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-15
    strategy:
      fail-fast: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - name: Add the Intel target
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-macos
      # ARCHS defaults to `arm64 x86_64`; stated explicitly because a release
      # asset that is silently single-arch is exactly what ships broken.
      # The Makefile parses `cargo rustc --print native-static-libs` output and
      # sets CARGO_TERM_COLOR=never itself, so do not force a colour here.
      - name: Build the screen saver
        run: make -C platform/macos ARCHS="arm64 x86_64"
      - name: Assert the saver is universal
        shell: bash
        run: |
          set -euo pipefail
          binary="platform/macos/build/Gibson.saver/Contents/MacOS/Gibson"
          archs="$(lipo -archs "$binary")"
          echo "saver architectures: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::$binary has no $arch slice (found: $archs)"; exit 1 ;;
            esac
          done
      - name: Package the screen saver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd platform/macos/build && zip -rq "$GITHUB_WORKSPACE/dist/Gibson.saver.zip" Gibson.saver)
          unzip -l dist/Gibson.saver.zip
      - name: Build the desktop app for both architectures
        run: |
          cargo build --release -p gibson-app --target aarch64-apple-darwin
          cargo build --release -p gibson-app --target x86_64-apple-darwin
      - name: Package the desktop app
        shell: bash
        run: |
          set -euo pipefail
          stage=dist/hack-the-gibson-macos-universal
          mkdir -p "$stage"
          lipo -create \
            target/aarch64-apple-darwin/release/gibson-app \
            target/x86_64-apple-darwin/release/gibson-app \
            -output "$stage/gibson-app"
          archs="$(lipo -archs "$stage/gibson-app")"
          echo "app architectures: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::gibson-app has no $arch slice (found: $archs)"; exit 1 ;;
            esac
          done
          cp GPL.txt "$stage/GPL.txt"
          cat > "$stage/README.txt" <<'EOF'
          Hack the Gibson - macOS desktop app
          ===================================

          Run ./gibson-app from this directory, or drag it to Applications.

          gibson-app --help          list every option
          gibson-app --fullscreen    fullscreen flythrough; Esc or Q quits

          This binary is universal (Apple silicon + Intel). It is ad-hoc signed
          but not notarized, so Gatekeeper refuses the first launch: right-click
          gibson-app and choose Open, or approve it once under
          System Settings > Privacy & Security.

          Settings live in
            ~/Library/Application Support/hack-the-gibson/gibson.toml
          which is written with defaults and comments on first run.

          Licensed GPL-3.0-or-later; see GPL.txt.
          EOF
          tar -czf dist/hack-the-gibson-macos-universal.tar.gz -C dist hack-the-gibson-macos-universal
          tar -tzf dist/hack-the-gibson-macos-universal.tar.gz
      - name: Upload to the draft release
        if: needs.create-release.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/Gibson.saver.zip \
            dist/hack-the-gibson-macos-universal.tar.gz \
            --clobber

  build-windows:
    name: Windows (.scr)
    needs: [guard, create-release]
    if: always() && !cancelled() && needs.guard.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-windows
      # Build only: the test matrix lives in ci.yml and runs on every push, and
      # a tag is cut from a commit that already went through it.
      - name: Build the desktop app
        run: cargo build --release -p gibson-app
      # An .scr is what the user installs, so it is uploaded as-is rather than
      # wrapped in an archive.
      - name: Stage Gibson.scr
        shell: pwsh
        run: Copy-Item target/release/gibson-app.exe Gibson.scr
      - name: Upload to the draft release
        if: needs.create-release.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" Gibson.scr --clobber

  build-linux:
    name: Linux x86_64 (xscreensaver)
    needs: [guard, create-release]
    if: always() && !cancelled() && needs.guard.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Kept in sync with the `linux` job in ci.yml: winit's wayland stack needs
      # libwayland-client and libxkbcommon headers at build time, and x11-dl
      # dlopens libX11 at runtime.
      - name: Install X11 / Wayland dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-linux
      # Build only; see the note in build-windows.
      - name: Build the desktop app
        run: cargo build --release -p gibson-app
      # gibson.xml is the xscreensaver descriptor and is useless without the
      # binary, so the two ship together.
      - name: Package the desktop app
        shell: bash
        run: |
          set -euo pipefail
          stage=dist/hack-the-gibson-linux-x86_64
          mkdir -p "$stage"
          install -m 755 target/release/gibson-app "$stage/gibson-app"
          cp platform/linux/gibson.xml "$stage/gibson.xml"
          cat > "$stage/README.txt" <<'EOF'
          Hack the Gibson - Linux x86_64 desktop app and xscreensaver hack
          =================================================================

          Binary:      gibson-app (x86_64, dynamically linked against libc)
          Descriptor:  gibson.xml (options for the xscreensaver settings dialog)

          Windowed app:

            ./gibson-app                 start windowed; Esc or Q quits
            ./gibson-app --fullscreen    fullscreen flythrough
            ./gibson-app --help          list every option

          xscreensaver hack:

            install -m 755 gibson-app ~/.local/bin/gibson
            sudo cp gibson.xml /usr/share/xscreensaver/config/gibson.xml
            # then add to ~/.xscreensaver:  programs: gibson -root

          Settings are read from ~/.config/hack-the-gibson/gibson.toml, which is
          written with defaults and comments on first run. Anything on the
          command line overrides the file.

          Built against wgpu's Vulkan backend; it renders into the X11 window
          xscreensaver hands it. On Wayland, use the fullscreen mode under
          swayidle instead, since xscreensaver is X11-only.

          The X11 path is compile-verified in CI but has never been exercised on
          a real X server. Licensed GPL-3.0-or-later.
          EOF
          tar -czf dist/hack-the-gibson-linux-x86_64.tar.gz -C dist hack-the-gibson-linux-x86_64
          tar -tzf dist/hack-the-gibson-linux-x86_64.tar.gz
      - name: Upload to the draft release
        if: needs.create-release.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/hack-the-gibson-linux-x86_64.tar.gz --clobber

  build-web:
    name: Web bundle
    needs: [guard, create-release]
    if: always() && !cancelled() && needs.guard.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-web
      # Kept in sync with the `wasm` job in ci.yml and the deploy job in
      # pages.yml (which already carry the same note): the prebuilt binary from
      # the official wasm-pack release is used instead of `cargo install`, which
      # would rebuild it from source on every run. Digest verified before use.
      - name: Install wasm-pack
        run: |
          curl -sSfL -o wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz
          echo "$PWD/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build web bundle
        run: wasm-pack build crates/gibson-web --target web --release --out-dir ../../web/pkg
      - name: Package the web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -rq dist/hack-the-gibson-web.zip web
          unzip -l dist/hack-the-gibson-web.zip
      - name: Upload to the draft release
        if: needs.create-release.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/hack-the-gibson-web.zip --clobber

  # Checksums are computed over the assets as they were uploaded, so the file
  # describes exactly the bytes GitHub serves. Publishing is the last step, after
  # every asset and SHA256SUMS are in place.
  finalize:
    name: Checksums and publish
    needs: [guard, create-release, build-macos, build-windows, build-linux, build-web]
    if: always() && !cancelled() && needs.create-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.guard.outputs.tag }}
      # Single source of truth for the five contract asset names, used by both
      # the download and the checksum step below.
      RELEASE_ASSETS: Gibson.saver.zip Gibson.scr hack-the-gibson-macos-universal.tar.gz hack-the-gibson-linux-x86_64.tar.gz hack-the-gibson-web.zip
    steps:
      # Download and validation are one step so that a failure always names the
      # asset it is complaining about and shows what the release actually
      # holds, rather than surfacing a bare gh error. gh exits non-zero when no
      # pattern matches at all, but exits 0 and silently skips an individual
      # non-matching pattern, so the explicit presence check is what really
      # guarantees all five arrived.
      - name: Download and verify every asset
        shell: bash
        run: |
          set -euo pipefail
          read -r -a assets <<< "$RELEASE_ASSETS"
          mkdir -p dist
          patterns=()
          for asset in "${assets[@]}"; do
            patterns+=(-p "$asset")
          done
          if ! gh release download "$TAG" --dir dist --clobber "${patterns[@]}"; then
            echo "::error::gh release download failed for $TAG"
            echo "assets present on the release:"
            gh release view "$TAG" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          missing=()
          for asset in "${assets[@]}"; do
            [ -f "dist/$asset" ] || missing+=("$asset")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::release $TAG is missing ${#missing[@]} of ${#assets[@]} assets: ${missing[*]}"
            echo "assets present on the release:"
            gh release view "$TAG" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          ls -l dist
      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          read -r -a assets <<< "$RELEASE_ASSETS"
          # Bare filenames, so `shasum -a 256 -c SHA256SUMS` verifies in
          # whatever directory the user downloaded into. sha256sum and
          # shasum emit the same format.
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Print the digests into the job log
        working-directory: dist
        run: cat SHA256SUMS
      - name: Upload SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/SHA256SUMS --clobber
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
