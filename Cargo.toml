[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "2.1.1"
repository = "https://github.com/paulkiernan/gibson-screensaver"
homepage = "https://paulkiernan.github.io/gibson-screensaver/"

[workspace.dependencies]
# Local crates.
gibson-types = { path = "crates/gibson-types" }
gibson-scene = { path = "crates/gibson-scene" }
gibson-atlas = { path = "crates/gibson-atlas" }
gibson-floor = { path = "crates/gibson-floor" }
gibson-render = { path = "crates/gibson-render" }
gibson-core = { path = "crates/gibson-core" }

# Shared external crates — single source of truth for versions across the workspace.
wgpu = "30"
winit = "0.30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# rand with default features pulls getrandom's OS RNG, which does not build for
# wasm32-unknown-unknown; every generator in this project is deterministic
# (StdRng from a seed), so only std + std_rng are enabled.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
fontdue = "0.9"
log = "0.4"
pollster = "1.0"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
dirs = "7"
png = "0.18"
serde_json = "1"
raw-window-handle = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
x11-dl = "2"
windows-sys = "0.61"

# Lint policy. Each member opts in with `[lints] workspace = true`, so there is exactly one
# place a level is set and a local `cargo clippy` reports exactly what CI does.
#
# Cargo's own mechanism (1.74+, and `rust-toolchain.toml` pins stable well past that) rather
# than `-D warnings` spelled into every CI invocation or `#![deny]` attributes in the sources:
#   - a level set in the manifest cannot be forgotten by a workflow that runs clippy with
#     different flags, and there is no way to lint a crate that skipped the policy;
#   - `#![deny]` in a source file is invisible until you open that file, and it silently
#     applies to test/example code that the attribute's author never considered.
#
# `clippy::all` is the default set (correctness, suspicious, style, complexity, perf) - that is
# the styleguide this repository enforces. It is deliberately not extended with
# `clippy::pedantic`, which is full of opinions this codebase argues with on purpose (the
# renderer and the generators are built out of deliberate numeric casts and bit twiddling).
# No `clippy::allow`-style escape hatch is configured: an `#[allow]` in the source with a
# comment saying why is the only way to silence a lint, and it has to be paid for in review.
#
# `rust`'s `unused` group rides along so a build fails on dead code, an unused import or an
# unused `mut` as well: the tree is clean of those today, and the wasm and host targets are
# linted separately (see .github/workflows/ci.yml) so a warning cannot hide in a cfg the
# default build does not compile.
[workspace.lints.rust]
unused = "deny"

[workspace.lints.clippy]
all = "deny"

# Release profile: the renderer spends its life emitting instanced draws; keep it fast.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds of the wgpu dependency stack are otherwise unusably slow.
[profile.dev.package."*"]
opt-level = 2
