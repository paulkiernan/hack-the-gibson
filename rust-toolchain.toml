# The toolchain every build in this repository uses: CI, the screen-saver Makefile, and your
# shell inside the checkout. rustup reads this file, so the `cargo`, `rustc` and `clippy` you get
# here are the versions CI uses - no workflow installs a toolchain of its own (see
# .github/workflows/ci.yml).
#
# Pinned to an exact version on purpose. The lint levels live in Cargo.toml's [workspace.lints]
# table as `deny`, so a new Clippy or rustc release can add a lint that fails a build nobody
# touched. On a floating `stable` channel that lands on someone else's pull request, for a reason
# that has nothing to do with their change; pinned, it lands once, deliberately, in the commit
# that bumps this line. See "Bumping Rust" in CONTRIBUTING.md for what that commit has to do.
#
# Dependabot does not manage this file; it watches the manifests and the workflows only.
[toolchain]
channel = "1.98.1"
# Both are part of the gate and neither is in the minimal profile.
components = ["rustfmt", "clippy"]
