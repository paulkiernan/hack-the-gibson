[package]
name = "gibson-render"
description = "Hack the Gibson wgpu renderer: instanced towers, PCB floor, pulses, bloom, motion blur, and composite."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gibson-types = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }

# The uncaptured-device-error handler writes to the browser console directly, so it still
# reaches a human when no `log` logger is installed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
gibson-atlas = { workspace = true }
gibson-floor = { workspace = true }
png = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
