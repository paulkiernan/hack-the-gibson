[package]
name = "gibson-floor"
description = "Hack the Gibson PCB floor-map generator: 45-degree routing, bus bundles, component footprints, power rails and copper pours on a toroidal cell grid."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gibson-types = { workspace = true }
rand = { workspace = true }

# Opt into the root Cargo.toml's [workspace.lints] policy: one place sets levels, so a local
# `cargo clippy` reports exactly what CI does.
[lints]
workspace = true
